<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 120 120" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="wdc-brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#e3c97f"/>
    </linearGradient>
    <linearGradient id="wdc-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142e5c"/>
      <stop offset="100%" stop-color="#090a0b"/>
    </linearGradient>
    <filter id="wdc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background deep circle (optional, for standalone use) -->
  <circle cx="60" cy="60" r="56" fill="url(#wdc-deep)" opacity="0.9"/>

  <!-- Brand mark: abstract shield / agent lens -->
  <g transform="translate(60, 60)">
    <!-- Outer ring -->
    <path d="M-42,-42 A42,42 0 1,1 42,-42 A42,42 0 1,1 -42,-42 Z" 
          fill="none" stroke="url(#wdc-brass)" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6"/>
    
    <!-- Inner lens shape -->
    <path d="M-26,-10 Q0,-34 26,-10 Q26,26 0,34 Q-26,26 -26,-10 Z" 
          fill="none" stroke="url(#wdc-brass)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- WDC monogram negative space -->
    <path d="M-16,-6 L-16,6 L-4,6 L-4,-6 Z M4,-6 L4,6 L16,6 L16,-6 Z" 
          fill="#090a0b"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="4" r="2.5" fill="#c9a227"/>
  </g>

  <!-- Wordmark -->
  <text x="120" y="62" font-family="'Instrument Serif', Georgia, serif" font-size="11" font-weight="700" 
        letter-spacing="0.32em" fill="#f2efe9" text-anchor="start">WE DO CARE</text>
  <text x="120" y="78" font-family="'Manrope', sans-serif" font-size="8.5" font-weight="800" 
        letter-spacing="0.5em" fill="#c9a227" text-anchor="start">GLOBAL</text>
</svg>
